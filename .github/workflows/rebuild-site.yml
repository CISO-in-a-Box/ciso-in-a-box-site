name: Rebuild site from source repo

# Runs in the ciso-in-a-box-site repo. Uses independent sibling
# checkouts (site/ + source/), regenerates the Jekyll source with the
# site-owned generator at scripts/generate_site.py, builds _site with
# Jekyll, gates on the site-owned verifier at scripts/verify_site.py
# (served under the configured baseurl /ciso-in-a-box-site), then
# commits the regenerated site to main. Pushing to main triggers
# GitHub Pages to publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.markdown'
      - 'sections.markdown'
      - 'markdown/**'
      - 'llms.txt'
      - 'manifest.json'
      - 'search-index.json'
      - '_config.yml'
      - '_includes/**'
      - 'assets/content/**'
      - 'robots.txt'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'scripts/**'
      - '.github/workflows/rebuild-site.yml'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0

      - name: Checkout source repo (public)
        uses: actions/checkout@v4
        with:
          repository: CroodSolutions/CISOinaBox
          ref: main
          path: source
          fetch-depth: 1

      - name: Record source SHA (full)
        id: src
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate site source
        run: |
          python site/scripts/generate_site.py \
            --source-root source \
            --site-root site \
            --source-commit "${{ steps.src.outputs.sha }}"
          echo "--- generated pages ---"
          find site/docs -name '*.markdown' | wc -l
          echo "--- generated content assets ---"
          find site/assets/content -type f | wc -l
          echo "--- generated markdown peers ---"
          find site/markdown -name '*.md' | wc -l

      - name: Confirm source checkout is unchanged
        run: |
          git -C source status --short
          test -z "$(git -C source status --short)" \
            || { echo "source checkout was modified by generation"; exit 1; }

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: site
          bundler: '2.7.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: |
          cd site
          bundle exec jekyll build -d _site

      - name: Serve built site locally under its base URL
        run: |
          # The built HTML uses baseurl /ciso-in-a-box-site, so serve
          # from a directory that exposes _site under that path to test
          # the actual configured base URL.
          rm -rf /tmp/serve
          mkdir -p /tmp/serve
          cp -r "$GITHUB_WORKSPACE/site/_site" /tmp/serve/ciso-in-a-box-site
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/serve &
          echo $! > /tmp/http.pid
          sleep 1

      - name: Run site verifier
        run: |
          python site/scripts/verify_site.py \
            --build-root site/_site \
            --base-url http://127.0.0.1:8765 \
            --source-commit "${{ steps.src.outputs.sha }}"

      - name: Stop local server
        if: always()
        run: |
          kill $(cat /tmp/http.pid) 2>/dev/null || true

      - name: Commit regenerated site
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only generator-owned output. assets/content/ holds
          # generated copies of source-repository files; markdown/,
          # llms.txt, manifest.json, and search-index.json are the
          # generated machine-readable layer; the rest of assets/ is
          # site-owned static files.
          git add docs sections.markdown _config.yml index.markdown contributing.markdown assets/content markdown llms.txt manifest.json search-index.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Regenerate site from source@$(git -C "$GITHUB_WORKSPACE/source" rev-parse --short HEAD)

          Source commit: ${{ steps.src.outputs.sha }}

          Auto-rebuild from CroodSolutions/CISOinaBox source updates.
          Generated by .github/workflows/rebuild-site.yml"
            git push
          fi