name: Rebuild site from source repo

# Runs in the ciso-in-a-box-site repo. Pulls the latest source content
# from the public CroodSolutions/CISOinaBox repo, regenerates the Jekyll
# source via generate_site.py, builds _site with Jekyll, gates on a local
# page health check, then commits the regenerated site to main.
# Pushing to main triggers GitHub Pages to publish.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.markdown'
      - 'sections.markdown'
      - '_config.yml'
      - '_includes/**'
      - 'assets/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/rebuild-site.yml'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-site
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: ciso-in-a-box-site
          fetch-depth: 0

      - name: Checkout source repo (public)
        uses: actions/checkout@v4
        with:
          repository: CroodSolutions/CISOinaBox
          ref: main
          path: source
          fetch-depth: 1

      - name: Capture source SHA
        id: src
        run: echo "sha=$(git -C source rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assemble source layout for generate_site.py
        run: |
          # generate_site.py expects ROOT/ to contain the numbered section
          # dirs and a sibling ciso-in-a-box-site/ output dir. Copy source
          # content to the workspace root (excluding the empty submodule
          # placeholder) so both live side by side. The site repo checkout
          # at ./ciso-in-a-box-site stays intact with its .git for the push.
          rm -rf source/ciso-in-a-box-site
          cp -r source/* .
          test -f generate_site.py
          test -f site_config.py
          test -f verify_site.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate site source
        run: |
          python generate_site.py
          echo "--- generated files ---"
          ls ciso-in-a-box-site/docs/ | head

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: ciso-in-a-box-site
          bundler: '2.7.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: |
          cd ciso-in-a-box-site
          bundle exec jekyll build -d _site

      - name: Serve built site locally
        run: |
          # verify_site.py and the built HTML both assume baseurl
          # /ciso-in-a-box-site, so serve from a dir that contains a
          # ciso-in-a-box-site/ symlink to _site.
          mkdir -p /tmp/serve/ciso-in-a-box-site
          ln -sfn "$GITHUB_WORKSPACE/ciso-in-a-box-site/_site" /tmp/serve/ciso-in-a-box-site
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/serve &
          echo $! > /tmp/http.pid
          sleep 1

      - name: Run page health check
        run: |
          python verify_site.py http://127.0.0.1:8765

      - name: Stop local server
        if: always()
        run: |
          kill $(cat /tmp/http.pid) 2>/dev/null || true

      - name: Commit regenerated site
        run: |
          cd ciso-in-a-box-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs sections.markdown _config.yml index.markdown contributing.markdown assets 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No site changes to commit"
          else
            git commit -m "Regenerate site from source@${{ steps.src.outputs.sha }}

          Auto-rebuild from CroodSolutions/CISOinaBox source updates.
          Generated by .github/workflows/rebuild-site.yml"
            git push
          fi